# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "REPLACE_WITH_YOUR_CLIENT_ID"
name = "store-shield"
handle = "store-shield"
application_url = "https://REPLACE_WITH_YOUR_APP_URL.example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# Read/write theme access is needed for the vulnerability scan feature
# (it reads theme asset source to look for exposed secrets / risky patterns).
scopes = "read_themes,write_themes"

[auth]
redirect_urls = [
  "https://REPLACE_WITH_YOUR_APP_URL.example.com/auth/callback",
  "https://REPLACE_WITH_YOUR_APP_URL.example.com/auth/shopify/callback",
  "https://REPLACE_WITH_YOUR_APP_URL.example.com/api/auth/callback"
]

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[pos]
embedded = false

[app_proxy]
url = "https://REPLACE_WITH_YOUR_APP_URL.example.com/proxy"
subpath = "store-shield"
prefix = "apps"
